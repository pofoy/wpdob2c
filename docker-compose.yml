# version: "3"
services:
  nginx:
    # build:
    #   context: ./nginx
    image: skisscc/nginx:php83
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    depends_on:
      memcached:
        condition: service_healthy
    volumes:
      - ./website/letsencrypt:/letsencrypt:ro
      # nginx config
      - ./nginx/nginx.conf:/usr/local/nginx/conf/nginx.conf
      - ./website/logs/nginx:/usr/local/nginx/logs
      # nginx vhosts config
      - ./website/http.d:/usr/local/nginx/conf.d
      # php config
      - ./php83/php.ini:/usr/local/etc/php/php.ini:ro
      - ./php83/www.conf:/usr/local/etc/php-fpm.conf:ro
      - ./website/logs/php83:/var/log/php
      # wwwroot
      - ./website/wwwroot:/wwwroot
    tmpfs:
      - /var/run/nginx-cache:rw,noexec,nosuid,size=512m
    networks:
      - default

  mysql:
    image: mysql/mysql-server:8.0.32-1.2.11-server
    # build:
    #   context: ./mysql
    container_name: mysql
    volumes:
      - ./mysql/my.conf:/etc/my.cnf:ro
      - ./website/data:/var/lib/mysql/:rw
    restart: unless-stopped
    networks:
      - default
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_USER: "${MYSQL_ROOT_USER}"
      TZ: "$TZ"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_ROOT_USER} -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  certbot:
    image: certbot/certbot:v4.2.0
    # build:
    #   context: ./certbot
    container_name: certbot
    restart: unless-stopped
    # Nginx 容器之后启动
    depends_on:
      - nginx
    volumes:
      # ssl cert root
      - ./website/letsencrypt:/etc/letsencrypt:rw
      # wwwroot
      - ./website/wwwroot:/wwwroot
      # logs
      - ./website/logs/certbot:/var/log/letsencrypt
    entrypoint: []
    command: ["tail", "-f", "/dev/null"]
    networks:
        - default

  memcached:
    image: memcached:1.6-alpine
    container_name: memcached
    command: ["memcached", "-m", "${MEMCACHED_MEMORY_MB:-256}", "-I", "2m", "-c", "1024"]
    restart: unless-stopped
    expose:
      - "11211"
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\r\n' | nc 127.0.0.1 11211 | grep -q VERSION"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default

networks:
  default:
    driver: bridge
